    <rect x="42" y="19" width="16" height="14" rx="4" fill="#FFFFFF"/>
  </g>
  <g transform="rotate(-45 50 50)">
    <rect x="46.5" y="34" width="7" height="38" rx="3.5" fill="#FFFFFF"/>
    <circle cx="50" cy="25" r="11" fill="#FFFFFF"/>
    <circle cx="50" cy="25" r="5.5" fill="#C7852A"/>
    <rect x="44" y="12" width="12" height="11" fill="#C7852A"/>
  </g>
