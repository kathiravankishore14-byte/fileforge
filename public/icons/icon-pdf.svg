<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sheen-pdf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="28" fill="#D63A2E"/>
  <rect width="100" height="100" rx="28" fill="url(#sheen-pdf)"/>
  <!-- white document page, folded top-left corner -->
  <path d="M40 18 H70 V82 H30 V28 Z" fill="#FFFFFF"/>
  <path d="M30 28 L40 18 V28 Z" fill="#FFFFFF" opacity="0.55"/>
  <!-- "PDF" written directly on the page -->
  <text x="50" y="56" font-family="Arial, sans-serif" font-weight="800" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#D63A2E" letter-spacing="0.5">PDF</text>
</svg>
