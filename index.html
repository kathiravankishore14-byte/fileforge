<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileForge: Free Online File Tools, No Upload Required</title>
    <meta name="description" content="Resize images, merge PDFs, generate QR codes, and more. Every tool runs entirely in your browser. No account, no file limit, no server upload." />
    <link rel="canonical" href="https://onlinetoolsweb.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FileForge: Free Online File Tools, No Upload Required" />
    <meta property="og:description" content="Resize images, merge PDFs, generate QR codes, and more. Every tool runs entirely in your browser. No account, no file limit, no server upload." />
    <meta property="og:url" content="https://onlinetoolsweb.com/" />
    <meta property="og:site_name" content="FileForge" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FileForge: Free Online File Tools, No Upload Required" />
    <meta name="twitter:description" content="Resize images, merge PDFs, generate QR codes, and more. Every tool runs entirely in your browser. No account, no file limit, no server upload." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!--HEADER-->

    <section class="hero">
      <h1>Work with files. Without uploading them.</h1>
      <p>Free PDF, image, document, and everyday tools that run directly in your browser.</p>

      <div class="home-search-wrap site-search-wrap">
        <input type="text" id="homeSearchInput" class="site-search-input home-search-input" placeholder="Search 63+ tools... (Ctrl+K)" aria-label="Search tools" />
        <div id="homeSearchResults" class="search-results-list"></div>
      </div>

      <div class="hero-trust-row">
        <span class="hero-trust-item">🔒 Private processing</span>
        <span class="hero-trust-item">⚡ No sign-up</span>
        <span class="hero-trust-item">🚀 Fast</span>
        <span class="hero-trust-item">💚 Free core tools</span>
      </div>
    </section>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="pdf">PDF</button>
      <button class="filter-tab" data-filter="image">Image</button>
      <button class="filter-tab" data-filter="excel">Excel</button>
      <button class="filter-tab" data-filter="word">Word</button>
      <button class="filter-tab" data-filter="ppt">PPT</button>
      <button class="filter-tab" data-filter="utilities">Other Tools</button>
    </div>

    <div class="tool-grid" id="toolGrid"></div>

    <div class="modal-backdrop hidden" id="modalBackdrop">
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="modalTitle"></h2>
          <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!--FOOTER-->

    <script type="module">
      import { initToolPage } from '/src/main.js';
      initToolPage('all');
    </script>
  </body>
</html>
