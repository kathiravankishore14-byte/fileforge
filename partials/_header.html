<script>
  // Applies the visitor's theme choice (or their OS preference, on a
  // first visit) before the header/hero below paints, so there's no
  // flash of the wrong theme. Kept tiny and synchronous on purpose —
  // this is the one bit of inline JS on the page, and the Worker
  // nonces every <script> tag (inline or external) automatically, so
  // it runs under CSP with no 'unsafe-inline' needed.
  (function () {
    try {
      var saved = localStorage.getItem('otw-theme');
      var theme = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      // localStorage/matchMedia unavailable (privacy mode, very old
      // browser) — the CSS prefers-color-scheme media query below
      // still picks a sensible default with zero JS.
    }
  })();
</script>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo">
      <img src="/icons/logo-mark.png" class="logo-mark-img" width="46" height="34" alt="" />
      <span class="logo-text-wrap">
        <img src="/icons/logo-wordmark.png" class="logo-wordmark-img" width="177" height="23" alt="OnlineToolsWeb" />
        <span class="logo-tagline">Fast <span aria-hidden="true">&bull;</span> Secure <span aria-hidden="true">&bull;</span> Everyday Tools</span>
      </span>
    </a>
    <!-- Static fallback shown before renderMainNav() (src/main.js) replaces
         this on load with the real hover dropdowns — kept as plain,
         icon-free links here since building the mega-menu content needs
         the JS-only tool data. -->
    <nav class="main-nav">
      <a href="/" class="nav-link">All Tools</a>
      <a href="/pdf" class="nav-link">PDF</a>
      <a href="/image" class="nav-link">Image</a>
      <a href="/other-tools" class="nav-link">Utilities</a>
      <a href="/about" class="nav-link">About Us</a>
    </nav>
    <div class="header-actions">
      <!-- Hover sounds are a desktop-only, hover-only affordance (see
           wireHoverSound in main.js) — no point offering this toggle on
           the mobile menu, where nothing it controls ever plays. Off by
           default; the visitor has to opt in before any sound plays. -->
      <button type="button" class="theme-toggle-btn" id="soundToggleBtn" aria-label="Turn on hover sounds" aria-pressed="false">
        <span class="icon icon-volume-x sound-icon-off" aria-hidden="true"></span>
        <span class="icon icon-volume sound-icon-on" aria-hidden="true"></span>
      </button>
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Switch to dark theme" aria-pressed="false">
        <span class="icon icon-sun theme-icon-light" aria-hidden="true"></span>
        <span class="icon icon-moon theme-icon-dark" aria-hidden="true"></span>
      </button>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenuPanel">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
