<div class="hero-drop-wrap">
  <!-- Rotating "featured tools" banner — replaces the old search box.
       Same slot/size, cycles a handful of popular tools with a short
       slide transition. Site search still lives in the mobile menu. -->
  <div class="ffh-banner" id="ffhBanner">
    <div class="ffh-banner-track" id="ffhBannerTrack"></div>
    <div class="ffh-banner-dots" id="ffhBannerDots"></div>
  </div>

  <div class="hero-drop-row">
    <div class="hero-drop-zone" id="heroDropZone">
      <input type="file" id="heroFileInput" multiple />
      <!-- Only this wrapper's innerHTML gets swapped between
           idle/analyzing/preview states — #heroFileInput above stays
           put the whole time so its listeners never need rewiring. -->
      <div class="hero-drop-content" id="heroDropContent">
        <div class="hero-drop-idle" id="heroDropIdle">
          <p class="hero-drop-text">Drag your file or browse</p>
          <p class="hero-drop-subtext">Accepts PDF, JPG, PNG, WEBP, Word, Excel &amp; PowerPoint</p>
        </div>
      </div>
    </div>

    <div class="hero-suggest-panel" id="heroSuggestPanel"></div>
  </div>

  <p class="awaiting-tool-hint" id="awaitingToolHint" style="display:none;">
    <button type="button" id="cancelAwaitingTool">← Choose a different tool</button>
  </p>
</div>
